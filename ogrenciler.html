<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Öğrenci Listesi | Cimnastik</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body class="bg-light">
    <script>if (localStorage.getItem('girisIzinBelgesi') !== 'onaylandi') window.location.href = 'login.html';</script>

    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 id="sayfaBasligi" class="text-primary mb-0"><strong>Tüm Aktif Öğrenciler</strong></h2>
            <div class="d-flex align-items-center">
                <input type="text" id="aramaKutusu" class="form-control me-3 border-primary shadow-sm" placeholder="🔍 Öğrenci Arama..." onkeyup="ogrenciAra()" style="max-width: 250px;">
                
                <button class="btn btn-outline-warning fw-bold me-2" id="btnArsiv" onclick="sekmeDegistir('pasif')">📁 Kaydı Bitenler</button>
                <button class="btn btn-info text-white fw-bold me-2 d-none" id="btnAktif" onclick="sekmeDegistir('aktif')">🟢 Aktif Öğrenciler</button>
                <button class="btn btn-success fw-bold me-2" onclick="exceleAktar()">📊 Excel'e İndir</button>
                <button class="btn btn-secondary fw-bold" onclick="window.close()">Kapat</button>
            </div>
        </div>

        <div class="card p-4 shadow-sm border-0" style="border-radius: 10px;">
        
            
            <ul class="nav nav-tabs mb-3" id="grupSekmeleri"></ul>

            <div class="table-responsive">
            
                <table class="table table-hover text-center align-middle text-nowrap" id="ogrenciTablosuExcel">
                    <thead class="table-dark">
                        <tr>
                            <th>Kayıt Tarihi</th>
                            <th>Ad Soyad</th>
                            <th>Grup</th>
                            <th>Paket</th>
                            <th>İlk Ders</th>
                            <th>Bitiş Tarihi</th>
                            <th>Kalan Ders</th>
                            <th>Ödeme Durumu</th>
                            <th>Alınan (₺)</th>
                            <th>Kalan (₺)</th>
                            <th>Ödeme Şekli</th>
                            <th>İşlemler</th>
                        </tr>
                    </thead>
                    <tbody id="listeGövdesi"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
     let tumOgrenciler = [];
        let aktifSekme = 'aktif';
        let seciliGrup = ''; // YENİ: Hangi grubun sekmesinde olduğumuzu tutar

        async function verileriCek() {
            let tablo = document.getElementById('listeGövdesi');
            tablo.innerHTML = "<tr><td colspan='12' class='fw-bold text-primary'>Veritabanına bağlanılıyor...</td></tr>";
            
            try {
                // Tarayıcının eski verileri hatırlamasını engellemek için t= saat hilesi
                let response = await fetch('https://okanjimnastik.pythonanywhere.com/ogrenciler?t=' + Date.now());
                let gelenVeri = await response.json(); 
                
                // SİHİRLİ SATIR: TamamenSilindi olanları listeye hiç alma, yoksay!
                tumOgrenciler = gelenVeri.filter(o => o.durum !== "TamamenSilindi");
                
                // Veritabanında gerçekten öğrenci var mı kontrolü
                if (tumOgrenciler.length === 0) {
                    tablo.innerHTML = `<tr><td colspan='12' class='text-danger fs-5 py-4'><b>Python Veritabanınızda hiç öğrenci yok.</b> Lütfen ana sayfadan yeni kayıt yapın.</td></tr>`;
                    return;
                }
                
                // Sistem sorunsuzsa sekmeleri ve tabloyu oluştur
                gruplariOlustur(); 
                tabloyuCiz();      
                
            } catch (error) { 
                tablo.innerHTML = `<tr><td colspan='12' class='text-danger fw-bold'>Bağlantı Hatası: Python sunucusu çalışmıyor olabilir! (${error.message})</td></tr>`; 
            }
        }
        function tabloyuCiz() {
            let tablo = document.getElementById('listeGövdesi');
            tablo.innerHTML = "";
            let gosterilecekler = 0;

            tumOgrenciler.sort((a, b) => new Date(a.kayitTarihiHam || 0) - new Date(b.kayitTarihiHam || 0));

            // Arama kutusunda bir şey yazıyorsa onu al
            let aramaKutusu = document.getElementById('aramaKutusu');
            let aranan = aramaKutusu ? aramaKutusu.value.toLowerCase().trim() : "";

            tumOgrenciler.forEach(ogr => {
                let kalan = 0; 
                let ilkDersMetni = "-";
                let bitisMetni = "-";

                // Tarih hesaplamaları
                if (ogr.kayitTarihiHam && ogr.paket && ogr.grup) {
                    let tarihler = tarihleriHesapla(ogr.kayitTarihiHam, ogr.paket, ogr.grup);
                    kalan = kalanDersiBul(tarihler.ilkDers, ogr.paket, ogr.grup);
                    ilkDersMetni = tarihler.ilkDers.toLocaleDateString('tr-TR');
                    
                    if (ogr.bitis_tarihi && ogr.bitis_tarihi !== "") {
                        bitisMetni = new Date(ogr.bitis_tarihi).toLocaleDateString('tr-TR') + " <span title='Elle Uzatıldı' class='text-dark'>✍️</span>";
                    } else {
                        bitisMetni = tarihler.bitisTarihi.toLocaleDateString('tr-TR');
                    }
                }

                let gercekDurum = (kalan <= 0 || ogr.durum === "Pasif") ? "pasif" : "aktif";
                
                // Arama kutusu filtresi
                let aramaKutusu = document.getElementById('aramaKutusu');
                let aranan = aramaKutusu ? aramaKutusu.value.toLowerCase().trim() : "";
                let isimUyuyorMu = aranan === "" || (ogr.ad && ogr.ad.toLowerCase().includes(aranan));

                // Ekrana basma şartları
                if (gercekDurum === aktifSekme && ogr.grup === seciliGrup && isimUyuyorMu) {
                    gosterilecekler++;
                    
                    // tabloyuCiz fonksiyonu içindeki 'islem' değişkenini bul ve şu şekilde güncelle:
let islem = aktifSekme === 'aktif' 
    ? `<button class="btn btn-sm btn-outline-primary border-0 fs-5 px-1" onclick="ogrenciDuzenle(${ogr.id})" title="✏️ DÜZENLE">✏️</button>
       <button class="btn btn-sm btn-outline-warning border-0 fs-5 px-1" onclick="ogrenciArsivle(${ogr.id})" title="📦 ARŞİVE TAŞI">📦</button>
       <button class="btn btn-sm btn-outline-danger border-0 fs-5 px-1" onclick="ogrenciArsivle(${ogr.id})" title="🗑️ ARŞİVE GÖNDER">🗑️</button>` // Sil butonu da artık Arşivle çağırıyor
    : `<button class="btn btn-sm btn-outline-success border-0 fs-5 px-1" onclick="yeniPaketTanimla('${ogr.ad}')" title="🔄 YENİ PAKET">🔄</button>
       <button class="btn btn-sm btn-outline-danger border-0 fs-5 px-1" onclick="ogrenciSil(${ogr.id})" title="🗑️ KALICI SİL">🗑️</button>`;

                    // İŞTE EKSİK OLAN KAHRAMAN: Ödeme rozeti rengini belirleyen satır!
                    let odemeRozeti = ogr.odeme === 'Tamamı Alındı' ? 'bg-success' : (ogr.odeme === 'Kısmi Ödeme' ? 'bg-warning text-dark' : 'bg-danger');

                    tablo.innerHTML += `<tr>
                        <td>${new Date(ogr.kayitTarihiHam).toLocaleDateString('tr-TR')}</td>
                        <td><strong>${ogr.ad || "İsim Yok"}</strong></td>
                        <td>${ogr.grup}</td>
                        <td>${ogr.paket} Saat</td>
                        <td><span class="text-primary fw-bold">${ilkDersMetni}</span></td>
                        
                        <td id="tarihHucre_${ogr.id}">
                            <span class="text-danger fw-bold">${bitisMetni}</span>
                            <button class="btn btn-sm btn-link text-decoration-none p-0 ms-1" onclick="tarihDuzenleAc(${ogr.id})" title="Tarihi Elle Değiştir">📅</button>
                        </td>

                        <td><strong class="fs-5">${kalan}</strong></td>
                        <td><span class="badge ${odemeRozeti}">${ogr.odeme || "-"}</span></td>
                        <td class="text-success fw-bold">${ogr.alinan_odeme} ₺</td>
                        <td class="text-danger fw-bold">${ogr.kalan_odeme} ₺</td>
                        <td><span class="badge bg-secondary">${ogr.odeme_sekli}</span></td>
                        <td>${islem}</td>
                    </tr>`;
                }
            });
            if(gosterilecekler === 0) tablo.innerHTML = `<tr><td colspan='10' class='text-muted py-4'>Bu grupta öğrenci bulunmuyor.</td></tr>`;
        }

        function sekmeDegistir(hedef) {
            aktifSekme = hedef;
            seciliGrup = ''; // Ana sekmeler arası geçişte grubu sıfırla ki otomatik ilki seçilsin
            document.getElementById('sayfaBasligi').innerText = (hedef === 'pasif') ? "Arşiv / Kaydı Bitenler" : "Tüm Aktif Öğrenciler";
            document.getElementById('sayfaBasligi').className = (hedef === 'pasif') ? "text-warning mb-0" : "text-primary mb-0";
            document.getElementById('btnArsiv').classList.toggle('d-none', hedef === 'pasif');
            document.getElementById('btnAktif').classList.toggle('d-none', hedef === 'aktif');
            gruplariOlustur();
            tabloyuCiz();
        }
        async function ogrenciSil(id) { 
            if(aktifSekme === 'aktif') {
                if(confirm("Bu öğrenciyi listeden kaldırıp arşive göndermek istiyor musunuz?")) { 
                    await fetch('https://okanjimnastik.pythonanywhere.com/ogrenci_arsivle/' + id, { 
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' }
                    }); 
                    verileriCek(); 
                }
            } else {
                if(confirm("DİKKAT! Bu öğrenciyi veritabanından KALICI olarak silmek üzeresiniz. Onaylıyor musunuz?")) { 
                    await fetch('https://okanjimnastik.pythonanywhere.com/ogrenci_sil/' + id, { 
                        method: 'DELETE',
                        headers: { 'Content-Type': 'application/json' }
                    }); 
                    verileriCek(); 
                } 
            }
        }

        async function ogrenciArsivle(id) { 
            if(confirm("Arşive taşınsın mı?")) { 
                await fetch('https://okanjimnastik.pythonanywhere.com/ogrenci_arsivle/' + id, { 
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' }
                }); 
                verileriCek(); 
            } 
        }
        async function ogrenciArsivle(id) { if(confirm("Arşive taşınsın mı?")) { await fetch('https://okanjimnastik.pythonanywhere.com/ogrenci_arsivle/' + id, { method: 'PUT' }); verileriCek(); } }

        // BÜTÜN GRUPLAR HAFTADA 2 SAAT (2 GÜN) OLACAK ŞEKİLDE SABİTLENDİ
        function isGecerliGun(tarih, grup) {
            let gun = tarih.getDay(); 
            
            if (grup && grup.startsWith("HS")) {
                return gun === 0 || gun === 6; // Hafta Sonu: Cmt(6) ve Paz(0)
            } else if (grup === "HI") {
                return gun === 2 || gun === 4; // Hafta İçi: Salı(2) ve Perşembe(4)
            } else if (grup === "Ozel") {
                return gun === 1 || gun === 4; // Özel: Pzt(1) ve Perş(4)
            } else if (grup === "E10") {
                return gun === 1 || gun === 3; // E10: Pzt(1) ve Çarş(3)
            } else if (grup === "E11") {
                return gun === 3 || gun === 5; // E11: Çarş(3) ve Cuma(5)
            } else {
                return gun === 2 || gun === 5; // Yeni bir grup eklenirse hata vermesin, haftada 2 gün saysın
            }
        }
        function tarihleriHesapla(kayitTarihiStr, paket, grup) {
            let kayit = new Date(kayitTarihiStr);
            let gunIndex = kayit.getDay(); // 0: Pazar, 1: Pzt, 2: Salı, 3: Çarş, 4: Perş, 5: Cuma, 6: Cmt
            
            // Paket süresini hafta bazında hesaplıyoruz (Haftada 2 gün üzerinden)
            // 8 saat = 4 hafta, 24 saat = 12 hafta, 48 saat = 24 hafta gibi...
            let haftaSayisi = paket / 2; 
            
            let bitis = new Date(kayit);
            
            // --- HAFTA İÇİ GRUBU MANTIĞI ---
            if (!grup.startsWith("HS")) {
                if (gunIndex >= 1 && gunIndex <= 4) { 
                    // 1. KURAL: Pzt-Perş arası kayıtlar -> 4 hafta sonraki CUMA biter
                    bitis.setDate(bitis.getDate() + (haftaSayisi * 7));
                    // O haftanın Cuma gününe (5) sabitle
                    while(bitis.getDay() !== 5) bitis.setDate(bitis.getDate() + 1);
                } 
                else if (gunIndex === 5 || gunIndex === 6 || gunIndex === 0) { 
                    // 2. KURAL: Cuma (veya boşta kalan hafta sonu) kayıtları -> 5 hafta sonraki PAZARTESİ biter
                    bitis.setDate(bitis.getDate() + ((haftaSayisi + 1) * 7));
                    // O haftanın Pazartesi gününe (1) sabitle
                    while(bitis.getDay() !== 1) bitis.setDate(bitis.getDate() - 1);
                }
            } 
            // --- HAFTA SONU GRUBU MANTIĞI ---
            else {
                if (gunIndex === 6) { 
                    // 3. KURAL: Cumartesi kayıt olan -> 4 hafta sonraki PAZAR biter
                    bitis.setDate(bitis.getDate() + (haftaSayisi * 7));
                    while(bitis.getDay() !== 0) bitis.setDate(bitis.getDate() + 1);
                } 
                else if (gunIndex === 0 || (gunIndex >= 1 && gunIndex <= 5)) { 
                    // 4. KURAL: Pazar kayıt olan -> 5 hafta sonraki CUMARTESİ biter
                    bitis.setDate(bitis.getDate() + ((haftaSayisi + 1) * 7));
                    while(bitis.getDay() !== 6) bitis.setDate(bitis.getDate() - 1);
                }
            }

            // İlk ders gününü sistemin çalışma gününe göre ayarla (Görsel için)
            let ilkDers = new Date(kayit);
            while (!isGecerliGun(ilkDers, grup)) ilkDers.setDate(ilkDers.getDate() + 1);

            return { ilkDers: ilkDers, bitisTarihi: bitis };
        }
        function kalanDersiBul(ilk, paket, grup) { let bugun = new Date(); bugun.setHours(0,0,0,0); let baslangic = new Date(ilk); baslangic.setHours(0,0,0,0); if (bugun < baslangic) return paket; let islenen = 0; let gecici = new Date(baslangic); while (gecici <= bugun && islenen < paket) { if (isGecerliGun(gecici, grup)) islenen++; gecici.setDate(gecici.getDate() + 1); } return paket - islenen; }
        function yeniPaketTanimla(ogrenciAdi) {
            // İsmi tarayıcı hafızasına geçici olarak kopyala
            localStorage.setItem('yenileyecekOgrenci', ogrenciAdi);
            // Ana sayfaya yönlendir
            window.location.href = 'index.html'; 
        }
        function exceleAktar() { let tablo = document.getElementById("ogrenciTablosuExcel"); let wb = XLSX.utils.table_to_book(tablo, {sheet: aktifSekme === "aktif" ? "Aktifler" : "Bitenler"}); XLSX.writeFile(wb, "Liste.xlsx"); }

        verileriCek();
        // YENİ: DİNAMİK SEKME OLUŞTURUCU
        // YENİ: DİNAMİK SEKME OLUŞTURUCU (ÖZEL SIRALAMALI)
        function gruplariOlustur() {
            let sekmeAlani = document.getElementById('grupSekmeleri');
            
            // Sadece o anki (Aktif/Arşiv) listedeki öğrencilerin gruplarını bul
            let mevcutGruplar = tumOgrenciler.filter(ogr => {
                let kalan = 0; 
                if (ogr.kayitTarihiHam && ogr.paket && ogr.grup) {
                    let tarihler = tarihleriHesapla(ogr.kayitTarihiHam, ogr.paket, ogr.grup);
                    kalan = kalanDersiBul(tarihler.ilkDers, ogr.paket, ogr.grup);
                }
                let gercekDurum = (kalan <= 0 || ogr.durum === "Pasif") ? "pasif" : "aktif";
                return gercekDurum === aktifSekme;
            }).map(o => o.grup);

            // BİZİM İSTEDİĞİMİZ KUSURSUZ SIRALAMA ŞABLONU
            const dogruSiralama = ["HS-1", "HS-2", "HS-3", "HS-4", "HS-5", "HS-6", "HS-7", "HS-8", "HI", "Ozel", "E10", "E11"];

            // Aynı grupları teke düşür ve bizim şablonumuza göre sıraya sok
            let gruplar = [...new Set(mevcutGruplar)].filter(Boolean).sort((a, b) => {
                let siraA = dogruSiralama.indexOf(a);
                let siraB = dogruSiralama.indexOf(b);
                
                // Eğer şablonda olmayan sürpriz bir grup gelirse en sona at
                if (siraA === -1) siraA = 999;
                if (siraB === -1) siraB = 999;
                
                return siraA - siraB;
            });

            // Eğer hiç grup yoksa sekmeleri temizle
            if (gruplar.length === 0) {
                sekmeAlani.innerHTML = '';
                seciliGrup = '';
                return;
            }

            // Seçili grup boşsa veya artık listede yoksa, otomatik olarak sıralamadaki ilk grubu seç
            if (!seciliGrup || !gruplar.includes(seciliGrup)) {
                seciliGrup = gruplar[0];
            }

            // Sekmeleri ekrana yazdır
            let html = '';
            gruplar.forEach(grup => {
                let aktifClass = grup === seciliGrup ? 'active bg-primary text-white fw-bold' : 'text-primary fw-bold';
                html += `
                <li class="nav-item">
                    <a class="nav-link ${aktifClass}" style="cursor:pointer; border-radius: 5px 5px 0 0;" onclick="grupDegistir('${grup}')">${grup}</a>
                </li>`;
            });
            sekmeAlani.innerHTML = html;
        }
        // YENİ: AKILLI ARAMA MOTORU
        function ogrenciAra() {
            let aramaKutusu = document.getElementById('aramaKutusu');
            if(!aramaKutusu) return;
            
            let aranan = aramaKutusu.value.toLowerCase().trim();
            
            if (aranan.length > 0) {
                // O anki sekmede (Aktif/Pasif) bu ismi içeren ilk öğrenciyi bul
                let bulunan = tumOgrenciler.find(ogr => {
                    let kalan = 0; 
                    if (ogr.kayitTarihiHam && ogr.paket && ogr.grup) {
                        let tarihler = tarihleriHesapla(ogr.kayitTarihiHam, ogr.paket, ogr.grup);
                        kalan = kalanDersiBul(tarihler.ilkDers, ogr.paket, ogr.grup);
                    }
                    let gercekDurum = (kalan <= 0 || ogr.durum === "Pasif") ? "pasif" : "aktif";
                    
                    return gercekDurum === aktifSekme && ogr.ad && ogr.ad.toLowerCase().includes(aranan);
                });

                // Öğrenci bulunduysa ve şu anki açık olan grupta değilse, o grubun sekmesine zıpla!
                if (bulunan && bulunan.grup !== seciliGrup) {
                    seciliGrup = bulunan.grup;
                    gruplariOlustur(); // Sekme renklerini güncelle
                }
            }
            tabloyuCiz(); // Tabloyu yeni duruma göre filtrele
        }
        // YENİ: SEKME DEĞİŞTİRME TETİKLEYİCİSİ
        function grupDegistir(yeniGrup) {
            seciliGrup = yeniGrup;
            gruplariOlustur(); // Sekme renklerini güncelle
            tabloyuCiz(); // Tabloyu sadece bu gruba göre çiz
        }
        function ogrenciDuzenle(id) {
            // Tıklanan öğrencinin tüm bilgilerini bul ve tarayıcı hafızasına paketle
            let ogr = tumOgrenciler.find(o => o.id === id);
            if(ogr) {
                localStorage.setItem('duzenlenecekOgrenci', JSON.stringify(ogr));
                window.location.href = 'index.html'; // Ana sayfaya uçur
            }
        }
        // YENİ: SATIR İÇİ HIZLI TARİH DEĞİŞTİRME (INLINE EDIT)
        function tarihDuzenleAc(id) {
            let ogr = tumOgrenciler.find(o => o.id === id);
            let hucre = document.getElementById('tarihHucre_' + id);
            let mevcutTarih = ogr.bitis_tarihi || "";

            // O hücrenin içindeki yazıyı silip, yerine küçük bir takvim kutusu ve onay butonları koyuyoruz
            hucre.innerHTML = `
                <div class="d-flex align-items-center justify-content-center">
                    <input type="date" id="yeniTarih_${id}" class="form-control form-control-sm me-1" value="${mevcutTarih}" style="width: 125px;">
                    <button class="btn btn-sm btn-success py-0 px-2 shadow-sm" onclick="tarihKaydet(${id})" title="Kaydet">✔️</button>
                    <button class="btn btn-sm btn-danger py-0 px-2 ms-1 shadow-sm" onclick="tabloyuCiz()" title="İptal">❌</button>
                </div>
            `;
        }

        async function tarihKaydet(id) {
            let ogr = tumOgrenciler.find(o => o.id === id);
            let secilenTarih = document.getElementById('yeniTarih_' + id).value;

            // Arka plandaki Güncelleme (PUT) rotasını kullanarak sadece tarihi değiştirip yolluyoruz
            let guncelVeri = {
                ad: ogr.ad,
                grup: ogr.grup,
                paket: ogr.paket,
                kayitTarihiHam: ogr.kayitTarihiHam,
                alinan_odeme: ogr.alinan_odeme,
                kalan_odeme: ogr.kalan_odeme,
                odeme_sekli: ogr.odeme_sekli,
                odeme: ogr.odeme,
                bitis_tarihi: secilenTarih // İşin sırrı buradaki yeni tarih
            };

            try {
                let hucre = document.getElementById('tarihHucre_' + id);
                hucre.innerHTML = `<span class="spinner-border spinner-border-sm text-primary"></span>`; // Kaydederken yükleniyor ikonu

                let response = await fetch('https://okanjimnastik.pythonanywhere.com/ogrenci_guncelle/' + id, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(guncelVeri)
                });

                if(response.ok) {
                    verileriCek(); // Kayıt başarılıysa tabloyu güncel haliyle yeniden çiz
                } else {
                    alert("Kayıt başarısız! Sunucu hatası.");
                    tabloyuCiz();
                }
            } catch(e) {
                console.error(e);
            }
        }
    </script>
</body>
</html>
