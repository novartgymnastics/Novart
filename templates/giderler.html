<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gider Yönetimi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>body { background-color: #f8f9fa; }</style>
</head>
<body>
    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="text-danger fw-bold">Gider Yönetimi</h2>
            <button class="btn btn-secondary fw-bold" onclick="window.close()">Kapat</button>
        </div>

        <div class="row">
            <div class="col-md-4">
                <div class="card p-4 shadow-sm border-danger border-top border-4">
                    <h5 class="mb-3">Yeni Gider Ekle</h5>
                    <form id="giderFormu">
                        <div class="mb-2">
                            <label class="form-label fw-bold">Tarih</label>
                            <input type="date" class="form-control" id="gTarih" required>
                        </div>
                        <div class="mb-2">
                            <label class="form-label fw-bold">Gider Türü</label>
                            <select class="form-select" id="gTur" required>
                                <option value="Kira">Kira</option><option value="Maaş/Eğitmen">Maaş / Eğitmen</option>
                                <option value="Fatura">Fatura</option><option value="Malzeme">Malzeme / Ekipman</option>
                                <option value="Diğer">Diğer</option>
                            </select>
                        </div>
                        <div class="mb-2">
                            <label class="form-label fw-bold">Açıklama</label>
                            <input type="text" class="form-control" id="gAciklama" placeholder="Örn: Elektrik faturası" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Tutar (₺)</label>
                            <input type="number" class="form-control" id="gTutar" required>
                        </div>
                        <button type="submit" class="btn btn-danger w-100 fw-bold">Gideri Kaydet</button>
                    </form>
                </div>
            </div>

            <div class="col-md-8">
                <div class="card p-4 shadow-sm h-100">
                    <div class="d-flex justify-content-between">
                        <h5 class="mb-3">Tüm Giderler</h5>
                        <h4 class="text-danger">Toplam: <span id="giderToplamMetni">0</span> ₺</h4>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle text-center">
                            <thead class="table-dark">
                                <tr>
                                    <thead class="table-dark">
                                <tr>
                                         <th>Tarih</th>
                                         <th>Tür</th>
                                         <th>Açıklama</th>
                                         <th>Tutar</th>
                                         <th>İşlemler</th>
                                </tr>
                            </thead>
                            </tr>
                            </thead>
                            <tbody id="giderListesi"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
      let giderler = JSON.parse(localStorage.getItem('cimnastikGiderler')) || [];
        
        document.getElementById('giderFormu').addEventListener('submit', function(e) {
            e.preventDefault();
            let yeniGider = {
                tarih: document.getElementById('gTarih').value,
                tur: document.getElementById('gTur').value,
                aciklama: document.getElementById('gAciklama').value,
                tutar: parseFloat(document.getElementById('gTutar').value)
            };
            giderler.push(yeniGider);
            localStorage.setItem('cimnastikGiderler', JSON.stringify(giderler));
            arayuzuGuncelle();
            document.getElementById('giderFormu').reset();
        });

        function arayuzuGuncelle() {
            let liste = document.getElementById('giderListesi');
            liste.innerHTML = "";
            let toplam = 0;

            // Orijinal indexi id olarak atayıp tarihe göre sıralıyoruz
            let siraliGiderler = giderler.map((g, index) => ({...g, id: index}))
                                         .sort((a, b) => new Date(b.tarih) - new Date(a.tarih)); 

            siraliGiderler.forEach(g => {
                toplam += g.tutar;
                let tarihFormat = new Date(g.tarih).toLocaleDateString('tr-TR');
                liste.innerHTML += `<tr>
                    <td>${tarihFormat}</td>
                    <td><span class="badge bg-secondary">${g.tur}</span></td>
                    <td>${g.aciklama}</td>
                    <td><strong>${g.tutar} ₺</strong></td>
                    <td>
                        <button class="btn btn-sm btn-outline-danger border-0" onclick="giderSil(${g.id})" title="Sil">🗑️</button>
                    </td>
                </tr>`;
            });
            document.getElementById('giderToplamMetni').innerText = toplam;
        }

        // Gider Silme Fonksiyonu
        function giderSil(id) {
            if(confirm("Bu gideri silmek istediğinize emin misiniz?")) {
                giderler.splice(id, 1);
                localStorage.setItem('cimnastikGiderler', JSON.stringify(giderler));
                arayuzuGuncelle();
            }
        }

        arayuzuGuncelle();
    </script>
</body>
</html>
